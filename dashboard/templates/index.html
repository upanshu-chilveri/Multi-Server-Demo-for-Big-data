<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Distributed DB Monitor</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050508 radial-gradient(circle at 50% 0%, #151025 0%, #050508 60%);
      color: #e2e2e2;
      font-family: 'Outfit', sans-serif;
      padding: 40px;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(90deg, #a855f7, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: #8b8d98;
      font-size: 14px;
      margin-top: 8px;
      font-weight: 400;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }
    .card {
      background: rgba(20, 22, 33, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
    }
    .stat {
      font-size: 36px;
      font-weight: 700;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .lbl {
      font-size: 13px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    
    /* Status Badge */
    .status-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      grid-column: span 2;
      background: linear-gradient(145deg, rgba(20, 22, 33, 0.8), rgba(15, 17, 26, 0.9));
    }
    .dot-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      z-index: 2;
    }
    .pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      z-index: 1;
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .alive { background: #34d399; box-shadow: 0 0 10px #34d399; }
    .alive-pulse { background: rgba(52, 211, 153, 0.4); }
    
    .dead { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
    .dead-pulse { background: rgba(239, 68, 68, 0.4); }
    
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(2.5); opacity: 0; }
    }
    #peerStatus {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    
    /* Chart */
    .wide {
      grid-column: 1 / -1;
      padding: 30px;
    }
    canvas {
      width: 100% !important;
      max-height: 250px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>System Telemetry Nexus</h1>
    <div class="subtitle">Distributed Node Metrics & Live Socket Monitoring</div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="stat" id="peerRtt">--</div>
      <div class="lbl">Peer-to-Peer RTT (ms)</div>
    </div>
    <div class="card">
      <div class="stat" id="hbRtt" style="background: linear-gradient(90deg, #f472b6, #fb923c); -webkit-background-clip: text;">--</div>
      <div class="lbl">Heartbeat RTT (ms)</div>
    </div>
    <div class="card">
      <div class="stat" id="chunks" style="background: linear-gradient(90deg, #34d399, #10b981); -webkit-background-clip: text;">0</div>
      <div class="lbl">Chunks Fetched</div>
    </div>
    <div class="card">
      <div class="stat" id="jitter">--</div>
      <div class="lbl">Jitter (ms) · CRC Fails: <span id="crc" style="color:#f87171">0</span></div>
    </div>
    <div class="card">
      <div class="stat" id="reqs" style="background: linear-gradient(90deg, #a78bfa, #c084fc); -webkit-background-clip: text;">0</div>
      <div class="lbl">Client Requests</div>
    </div>
    <div class="card">
      <div class="stat" id="bytes" style="background: linear-gradient(90deg, #fbbf24, #f59e0b); -webkit-background-clip: text;">0 MB</div>
      <div class="lbl">Total Bandwidth</div>
    </div>
    <div class="card status-card">
      <div class="dot-container">
         <div class="pulse" id="peerPulse"></div>
         <div class="dot" id="peerDot"></div>
      </div>
      <span id="peerStatus">Awaiting Peer Connection...</span>
    </div>
    
    <div class="card wide">
      <div class="lbl">Network Latency History (RTT)</div>
      <canvas id="rttChart"></canvas>
    </div>
  </div>

<script>
  // Setup Chart with a neon aesthetic
  const ctx = document.getElementById("rttChart").getContext("2d");
  
  // Create gradient for the line chart fill
  const gradient = ctx.createLinearGradient(0, 0, 0, 250);
  gradient.addColorStop(0, 'rgba(56, 189, 248, 0.4)');
  gradient.addColorStop(1, 'rgba(56, 189, 248, 0.0)');

  const chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [{
        label: "RTT ms",
        data: [],
        borderColor: "#38bdf8",
        backgroundColor: gradient,
        borderWidth: 2,
        tension: 0.4, // Smooth curve
        pointBackgroundColor: "#0f172a",
        pointBorderColor: "#38bdf8",
        pointBorderWidth: 2,
        pointRadius: 3,
        pointHoverRadius: 6,
        fill: true
      }]
    },
    options: {
      animation: { duration: 0 },
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { display: false },
        y: { 
          grid: { color: "rgba(255, 255, 255, 0.05)" },
          ticks: { color: "#94a3b8", font: { family: "'Outfit', sans-serif" } },
          border: { display: false }
        }
      },
      plugins: { 
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(15, 23, 42, 0.9)',
          titleFont: { family: "'Outfit', sans-serif" },
          bodyFont: { family: "'Outfit', sans-serif" },
          padding: 10,
          cornerRadius: 8,
          borderColor: 'rgba(255,255,255,0.1)',
          borderWidth: 1
        }
      }
    }
  });

  const ioSocket = io();
  ioSocket.on("m", d => {
    // Update text content with fallbacks
    document.getElementById("peerRtt").textContent = d.peer_rtt_avg || '--';
    document.getElementById("hbRtt").textContent   = d.hb_rtt_avg || '--';
    document.getElementById("chunks").textContent  = d.chunks_fetched || '0';
    document.getElementById("jitter").textContent  = d.jitter_ms || '--';
    document.getElementById("crc").textContent     = d.crc_failures || '0';
    document.getElementById("reqs").textContent    = d.client_requests || '0';
    document.getElementById("bytes").textContent   = ((d.bytes_served || 0)/1048576).toFixed(1) + " MB";
    
    // Status UI Updates
    const dot = document.getElementById("peerDot");
    const pulse = document.getElementById("peerPulse");
    const statusTxt = document.getElementById("peerStatus");
    
    if (d.peer_alive) {
      dot.className = "dot alive";
      pulse.className = "pulse alive-pulse";
      statusTxt.textContent = "Peer Node Online & Syncing";
      statusTxt.style.color = "#34d399";
    } else {
      dot.className = "dot dead";
      pulse.className = "pulse dead-pulse";
      statusTxt.textContent = "Peer Node UNREACHABLE";
      statusTxt.style.color = "#ef4444";
    }
    
    // Chart updates
    if (d.peer_rtt_hist && d.peer_rtt_hist.length > 0) {
        chart.data.labels = d.peer_rtt_hist.map((_,i) => i);
        chart.data.datasets[0].data = d.peer_rtt_hist;
        chart.update('none'); // Update without animation blocking
    }
  });
</script>
</body>
</html>
